  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");
  const searchInput = document.getElementById("search");
  const typeGroup = document.getElementById("type-group");
  const statCount = document.getElementById("stat-count");

  statCount.textContent = accommodations.length;

  const typeLabel = t => t || "미정";
  const types = ["전체", ...new Set(accommodations.map(a => typeLabel(a.type)))];
  typeGroup.innerHTML = types.map((t, i) =>
    `<button class="chip" data-type="${t}" aria-pressed="${i === 0 ? "true" : "false"}">${t}</button>`
  ).join("");

  let state = { q: "", type: "전체" };

  function fmtWon(n){
    return (n === null || n === undefined) ? "-" : (Number.isInteger(n) ? n : n.toFixed(1));
  }

  function photoHTML(item){
    if(item.photos.length === 0){
      return `<div class="card-photo empty">${roofSVG}<span class="photo-caption">사진 준비중</span><span class="type-badge">${typeLabel(item.type)}</span></div>`;
    }
    const imgs = item.photos.slice(0, 2).map(src => `<div class="photo-slot"><img src="${src}" alt="${item.name} 사진" loading="lazy"></div>`).join("");
    return `<div class="card-photo">${imgs}<span class="type-badge">${typeLabel(item.type)}</span></div>`;
  }

  function cardHTML(item){
    const bookingBtn = item.bookingUrl
      ? `<a class="btn primary" href="${item.bookingUrl}" target="_blank" rel="noopener">예약 페이지</a>`
      : `<span class="btn primary" style="opacity:.5; pointer-events:none;">예약 링크 준비중</span>`;
    return `
      <article class="card">
        ${photoHTML(item)}
        <div class="card-body">
          <h3 class="card-name">${item.name}</h3>
          <p class="card-address">
            <span>${item.address || "주소 정리중"}</span>
            ${item.address ? `<a class="map-link" href="https://map.naver.com/p/search/${encodeURIComponent(item.address)}" target="_blank" rel="noopener" aria-label="네이버 지도에서 길찾기">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0Z"/><circle cx="12" cy="10" r="3"/></svg>
            </a>` : ''}
          </p>
          <div class="fact-row">
            <div class="fact"><span class="k">인원</span><span class="v">기준 ${item.capacityBase ?? "-"} · 최대 ${item.capacityMax ?? "-"}</span></div>
            <div class="fact"><span class="k">요금</span><span class="v">평일 ${fmtWon(item.priceWeekday)}만 · 주말 ${fmtWon(item.priceWeekend)}만</span></div>
          </div>
          <div class="card-actions">
            ${item.phone ? `<a class="btn" href="tel:${item.phone}">${item.phone}</a>` : ''}
            ${bookingBtn}
          </div>
        </div>
      </article>
    `;
  }

  function render(){
    const q = state.q.trim().toLowerCase();
    const filtered = accommodations.filter(item => {
      const matchesQ = !q || (item.name + item.address).toLowerCase().includes(q);
      const matchesType = state.type === "전체" || typeLabel(item.type) === state.type;
      return matchesQ && matchesType;
    });
    grid.innerHTML = filtered.map(cardHTML).join("");
    empty.hidden = filtered.length !== 0;
  }

  searchInput.addEventListener("input", e => { state.q = e.target.value; render(); });

  typeGroup.addEventListener("click", e => {
    const btn = e.target.closest(".chip");
    if(!btn) return;
    [...typeGroup.children].forEach(c => c.setAttribute("aria-pressed", "false"));
    btn.setAttribute("aria-pressed", "true");
    state.type = btn.dataset.type;
    render();
  });

  render();
</script>
